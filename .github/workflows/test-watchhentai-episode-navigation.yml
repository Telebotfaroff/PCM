name: Test WatchHentai Episode Navigation

on:
  workflow_dispatch:
    inputs:
      episode_url:
        description: "WatchHentai episode URL (/videos/...)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  extract-navigation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install PCM
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Extract previous and next episode links
        env:
          EPISODE_URL: ${{ inputs.episode_url }}
        run: python scripts/test_watchhentai_episode_navigation.py --url "$EPISODE_URL" --output watchhentai-episode-navigation.json
      - name: Upload JSON artifact
        uses: actions/upload-artifact@v4
        with:
          name: watchhentai-episode-navigation
          path: watchhentai-episode-navigation.json
          if-no-files-found: error
          retention-days: 14
