name: Test WatchHentai Series Extraction

on:
  workflow_dispatch:
    inputs:
      series_url:
        description: "WatchHentai series URL (/series/...)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  extract-series:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install PCM
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Extract series episodes and details
        env:
          SERIES_URL: ${{ inputs.series_url }}
        run: python scripts/test_watchhentai_series.py --url "$SERIES_URL" --output watchhentai-series-result.json
      - name: Upload JSON artifact
        uses: actions/upload-artifact@v4
        with:
          name: watchhentai-series-extraction
          path: watchhentai-series-result.json
          if-no-files-found: error
          retention-days: 14
