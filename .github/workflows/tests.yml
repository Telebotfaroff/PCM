name: PCM tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install project and test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Run unit tests
        run: pytest -q
      - name: Run Ruff
        if: always()
        run: ruff check pcm/bot/handlers.py pcm/bot/ytdlp_handler.py pcm/bot/persistent_settings.py pcm/transfers/gofile.py tests/test_gofile.py --ignore E501
