[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pcm-private-content-manager"
version = "0.1.0"
description = "Private Telegram-controlled download and upload manager."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "Pyrogram>=2.0.106,<3.0",
  "TgCrypto>=1.2.5",
  "httpx>=0.27,<1.0",
  "asyncpg>=0.29,<1.0",
  "python-dotenv>=1.0,<2.0",
  "yt-dlp>=2024.10.22",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9.0", "pytest-asyncio>=0.23,<2.0", "ruff>=0.5,<1.0"]

[tool.setuptools.packages.find]
include = ["pcm*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
